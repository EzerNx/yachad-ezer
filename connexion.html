<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace équipe · Yachad Ezer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="he" lang="he">יחד עזר</span><b>Yachad Ezer</b></a>
    <nav><a href="devenir-intercesseur.html">Devenir intercesseur</a></nav>
  </header>

  <section id="loginSection">
    <span class="eyebrow">Espace équipe</span>
    <h1>Connexion</h1>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="l-email">Courriel</label>
        <input type="email" id="l-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="l-pass">Mot de passe</label>
        <input type="password" id="l-pass" autocomplete="current-password" required>
      </div>
      <span class="err" id="l-err" hidden></span>
      <button class="btn" type="submit" id="l-btn">Se connecter</button>
    </form>
  </section>

  <section id="waitSection" hidden aria-live="polite">
    <h2 id="waitTitle">Candidature en attente</h2>
    <p class="story" id="waitText"></p>
    <button class="btn ghost" id="logoutBtn" type="button">Se déconnecter</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module">
import { sb, showConfigWarning, explain, getMyProfile, signOut } from "./js/app.js";
const $ = (id) => document.getElementById(id);
showConfigWarning($("loginSection"));

// Envoie chaque personne vers le bon portail selon son rôle
async function route() {
  const me = await getMyProfile();
  if (!me) return;
  if (me.active && me.role === "admin") return location.replace("admin.html");
  if (me.active && me.role === "intercesseur") return location.replace("membre.html");
  $("loginSection").hidden = true;
  $("waitSection").hidden = false;
  if (me.role === "refuse") {
    $("waitTitle").textContent = "Candidature non retenue";
    $("waitText").textContent = "Votre candidature n’a pas été retenue pour le moment. Merci pour votre cœur de servir.";
  } else if (me.role === "intercesseur") {
    $("waitTitle").textContent = "Compte en pause";
    $("waitText").textContent = "Votre accès est en pause. Contactez l’administrateur si vous souhaitez reprendre.";
  } else {
    $("waitText").textContent = "Merci, " + (me.display_name || "") + ". L’administrateur examine votre candidature. Vous aurez accès à vos demandes dès qu’elle sera acceptée.";
  }
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("l-err").hidden = true;
  if (!sb) { $("l-err").textContent = "Le site n’est pas encore relié à Supabase."; $("l-err").hidden = false; return; }
  $("l-btn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $("l-email").value.trim(),
    password: $("l-pass").value,
  });
  $("l-btn").disabled = false;
  if (error) { $("l-err").textContent = explain(error); $("l-err").hidden = false; return; }
  route();
});

$("logoutBtn").addEventListener("click", signOut);
route();
</script>
</body>
</html>
