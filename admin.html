<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Portail admin · Yachad Ezer</title>
<meta name="theme-color" content="#0D1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="./"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1E2A57"/><path d="M32 7c7 11 16 19 15 33-1 10-7 17-15 17s-15-7-15-17c0-9 7-14 10-24 2 5 4 7 5 9 1-6 1-12 0-18z" fill="#E7B85A"/><path d="M32 30c4 6 8 10 7 16-1 5-4 8-7 8s-7-3-7-8c0-5 4-8 7-16z" fill="#FBF1DC"/></svg><b>Yachad Ezer</b></a>
    <span class="side-label">Administration</span>
    <button class="nav-item" type="button" data-tab="requests" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v6H4v-6z"/></svg>Demandes<span class="count" id="c-requests">0</span></button>
    <button class="nav-item" type="button" data-tab="observations"><svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>Observations<span class="count" id="c-observations">0</span></button>
    <button class="nav-item" type="button" data-tab="members"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.6 5.2"/></svg>Intercesseurs<span class="count" id="c-members">0</span></button>
    <button class="nav-item" type="button" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
    <span class="side-label">Prière</span>
    <a class="nav-item" href="membre.html"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>À prier</a>
    <div class="side-foot">
      <span id="meAvatar"></span>
      <div class="who"><b id="meName"></b><span>Administrateur</span></div>
      <button class="btn btn-ghost btn-sm" type="button" data-logout>Sortir</button>
    </div>
  </aside>

  <main class="app-main" id="main">
    <div class="mobile-top"><a class="brand" href="./"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1E2A57"/><path d="M32 7c7 11 16 19 15 33-1 10-7 17-15 17s-15-7-15-17c0-9 7-14 10-24 2 5 4 7 5 9 1-6 1-12 0-18z" fill="#E7B85A"/><path d="M32 30c4 6 8 10 7 16-1 5-4 8-7 8s-7-3-7-8c0-5 4-8 7-16z" fill="#FBF1DC"/></svg><b>Yachad Ezer</b></a><button class="btn btn-ghost btn-sm" type="button" data-logout>Sortir</button></div>
    <div id="panel"><p class="empty">Chargement…</p></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module">
import { sb, h, fmtDate, relDate, toast, NEEDS, STATUS, requireRole, signOut, avatar } from "./js/app.js";

const me = await requireRole(["admin"]);

let tab = "requests";
let requestFilter = "ouvertes";
let obsFilter = "a-traiter";
const state = { requests: [], members: [], observations: [], settings: null };

const one = (x) => (Array.isArray(x) ? x[0] : x) || null;   // relation 1-à-1 renvoyée en objet ou tableau
const member = (id) => state.members.find((m) => m.id === id);
const memberName = (id) => member(id)?.display_name || "Membre";

if (me) {
  document.getElementById("meName").textContent = me.display_name || "Admin";
  document.getElementById("meAvatar").replaceWith(avatar(me.id, me.display_name, "lg"));
  document.querySelectorAll("[data-logout]").forEach((b) => b.addEventListener("click", signOut));
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((x) => (x === b ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current")));
    render();
    window.scrollTo({ top: 0 });
  }));
  await loadAll();
}

async function loadAll() {
  const [r, m, o, s] = await Promise.all([
    sb.from("prayer_requests")
      .select("id, code, body, needs, wants_contact, status, created_at, expires_at, private:request_private(first_name, contact_method, contact_value), assignments(id, member_id, prayed_at)")
      .order("created_at", { ascending: false }),
    sb.from("profiles")
      .select("id, display_name, church, motivation, role, active, created_at, approved_at, engagement_at")
      .order("created_at"),
    sb.from("observations")
      .select("id, body, status, created_at, transmitted_at, member_id, request:prayer_requests(id, code, body, wants_contact, private:request_private(first_name, contact_method, contact_value))")
      .order("created_at", { ascending: false }),
    sb.from("app_settings").select("auto_assign, per_request").eq("id", 1).maybeSingle(),
  ]);
  const err = r.error || m.error || o.error || s.error;
  if (err) {
    console.error(err);
    document.getElementById("panel").replaceChildren(h("p", { class: "err" }, "Impossible de charger les données. Vérifiez votre connexion."));
    return;
  }
  state.requests = r.data;
  state.members = m.data;
  state.observations = o.data;
  state.settings = s.data;
  render();
}

// Exécute une action, affiche un message, puis recharge
async function act(promise, okMsg) {
  const { error } = await promise;
  if (error) { console.error(error); toast("Action impossible : " + (error.message || "erreur")); return false; }
  if (okMsg) toast(okMsg);
  await loadAll();
  return true;
}

function setCount(id, n, hot) {
  const el = document.getElementById(id);
  el.textContent = n;
  el.classList.toggle("hot", !!hot && n > 0);
}

function pageHead(title, sub, action) {
  return h("div", { class: "page-head" }, h("div", {}, h("h1", {}, title), sub ? h("p", {}, sub) : null), action || null);
}

function segmented(label, options, current, onPick) {
  return h("div", { class: "segmented", role: "group", "aria-label": label },
    options.map(([v, l]) => h("button", { type: "button", "aria-pressed": String(v === current), onclick: () => onPick(v) }, l)));
}

function render() {
  const unassigned = state.requests.filter((r) => r.status === "nouvelle").length;
  const newObs = state.observations.filter((o) => o.status === "nouvelle").length;
  const candidates = state.members.filter((m) => m.role === "candidat").length;
  setCount("c-requests", unassigned, true);
  setCount("c-observations", newObs, true);
  setCount("c-members", candidates, true);
  const view = { requests: viewRequests, observations: viewObservations, members: viewMembers, settings: viewSettings }[tab];
  document.getElementById("panel").replaceChildren(view());
}

/* ===================== DEMANDES ===================== */
function viewRequests() {
  const open = state.requests.filter((r) => r.status !== "fermee");
  const unassigned = state.requests.filter((r) => r.status === "nouvelle").length;
  const newObs = state.observations.filter((o) => o.status === "nouvelle").length;
  const active = state.members.filter((m) => m.active && ["intercesseur", "admin"].includes(m.role)).length;

  const distBtn = h("button", { class: "btn btn-primary btn-sm", type: "button" }, "Répartir les demandes");
  distBtn.addEventListener("click", async () => {
    distBtn.disabled = true;
    const { data, error } = await sb.rpc("distribute_new_requests");
    distBtn.disabled = false;
    if (error) { toast("Répartition impossible : " + error.message); return; }
    toast(data ? data + " attribution(s) faite(s)." : "Aucune attribution : pas de demande en attente ou pas d’intercesseur actif.");
    loadAll();
  });

  const list = state.requests.filter((r) =>
    requestFilter === "toutes" ? true :
    requestFilter === "ouvertes" ? r.status !== "fermee" : r.status === requestFilter);

  return h("div", { class: "stack", style: "gap:24px" },
    pageHead("Demandes de prière",
      "Bonjour " + (me.display_name || "") + ". " + (unassigned ? (unassigned === 1 ? "1 demande attend un intercesseur." : unassigned + " demandes attendent un intercesseur.") : "Toutes les demandes ont un intercesseur."),
      distBtn),
    h("div", { class: "tiles" },
      h("div", { class: "tile" }, h("span", { class: "num" }, open.length), h("span", { class: "lbl" }, "demandes ouvertes")),
      h("div", { class: unassigned ? "tile hot" : "tile" }, h("span", { class: "num" }, unassigned), h("span", { class: "lbl" }, "sans intercesseur")),
      h("div", { class: newObs ? "tile hot" : "tile" }, h("span", { class: "num" }, newObs), h("span", { class: "lbl" }, "observations à lire")),
      h("div", { class: "tile" }, h("span", { class: "num" }, active), h("span", { class: "lbl" }, "intercesseurs actifs"))),
    h("div", { class: "toolbar" },
      segmented("Filtrer les demandes",
        [["ouvertes", "Ouvertes"], ["nouvelle", "Sans intercesseur"], ["fermee", "Fermées"], ["toutes", "Toutes"]],
        requestFilter, (v) => { requestFilter = v; render(); })),
    h("div", { class: "list" },
      list.length ? list.map(requestCard) : h("p", { class: "empty" }, "Aucune demande ici pour l’instant.")));
}

function requestCard(r) {
  const p = one(r.private);
  const assigned = r.assignments || [];
  const available = state.members.filter((m) => m.active && ["intercesseur", "admin"].includes(m.role) && !assigned.some((a) => a.member_id === m.id));

  const pick = h("select", { "aria-label": "Ajouter un intercesseur à " + r.code },
    h("option", { value: "" }, "Ajouter un intercesseur…"),
    available.map((m) => h("option", { value: m.id }, m.display_name || "Membre")));
  pick.addEventListener("change", async () => {
    if (!pick.value) return;
    const ok = await act(sb.from("assignments").insert({ request_id: r.id, member_id: pick.value }), "Demande attribuée.");
    if (ok && r.status === "nouvelle") await act(sb.from("prayer_requests").update({ status: "assignee" }).eq("id", r.id));
  });

  const toggle = h("button", { class: "btn btn-secondary btn-sm", type: "button" }, r.status === "fermee" ? "Rouvrir" : "Fermer");
  toggle.addEventListener("click", () => act(
    sb.from("prayer_requests").update({ status: r.status === "fermee" ? (assigned.length ? "assignee" : "nouvelle") : "fermee" }).eq("id", r.id),
    r.status === "fermee" ? "Demande rouverte." : "Demande fermée."));

  const del = h("button", { class: "btn btn-ghost btn-sm", type: "button" }, "Supprimer");
  const foot = h("div", { class: "item-foot" },
    assigned.length
      ? h("div", { class: "people" }, assigned.map((a) => {
          const rm = h("button", { type: "button", "aria-label": "Retirer " + memberName(a.member_id) }, "×");
          rm.addEventListener("click", () => act(sb.from("assignments").delete().eq("id", a.id), "Intercesseur retiré."));
          return h("span", { class: a.prayed_at ? "person-chip done" : "person-chip" },
            avatar(a.member_id, memberName(a.member_id)), memberName(a.member_id) + (a.prayed_at ? " · a prié" : ""), rm);
        }))
      : h("span", { class: "hint" }, "Aucun intercesseur pour l’instant"),
    h("span", { class: "spacer" }),
    available.length && r.status !== "fermee" ? pick : null,
    toggle, del);

  del.addEventListener("click", () => {
    const yes = h("button", { class: "btn btn-danger btn-sm", type: "button" }, "Oui, supprimer");
    const no = h("button", { class: "btn btn-secondary btn-sm", type: "button" }, "Annuler");
    yes.addEventListener("click", () => act(sb.from("prayer_requests").delete().eq("id", r.id), "Demande supprimée."));
    no.addEventListener("click", render);
    foot.replaceChildren(h("span", {}, "Supprimer la demande, l’identité et les observations ?"), h("span", { class: "spacer" }), yes, no);
  });

  return h("article", { class: "item" },
    h("div", { class: "item-head" },
      h("span", { class: "code" }, r.code),
      h("span", { class: r.status === "nouvelle" ? "pill new" : r.status === "fermee" ? "pill" : "pill ok" }, STATUS[r.status]),
      h("span", { class: "meta" }, "Reçue " + relDate(r.created_at) + " · supprimée le " + fmtDate(r.expires_at))),
    h("div", { class: "identity" },
      h("span", {}, h("b", {}, "Personne"), (p && p.first_name) || "Anonyme"),
      p && p.contact_value
        ? h("span", {}, h("b", {}, p.contact_method === "courriel" ? "Courriel" : "Téléphone"), p.contact_value)
        : h("span", { class: "muted" }, r.wants_contact ? "Contact demandé, coordonnées manquantes" : "Ne souhaite pas être contactée")),
    h("p", { class: "body" }, r.body),
    h("div", { class: "tags" }, (r.needs || []).map((n) => h("span", { class: n === "priere" ? "tag" : "tag gold" }, NEEDS[n] || n))),
    foot);
}

/* ===================== OBSERVATIONS ===================== */
function viewObservations() {
  const list = state.observations.filter((o) =>
    obsFilter === "toutes" ? true : obsFilter === "transmise" ? o.status === "transmise" : o.status !== "transmise");
  return h("div", { class: "stack", style: "gap:24px" },
    pageHead("Observations", "Ce que les intercesseurs ont reçu en priant. Relisez avant de transmettre."),
    h("div", { class: "toolbar" },
      segmented("Filtrer les observations", [["a-traiter", "À traiter"], ["transmise", "Transmises"], ["toutes", "Toutes"]],
        obsFilter, (v) => { obsFilter = v; render(); })),
    h("div", { class: "list" }, list.length ? list.map(obsCard) : h("p", { class: "empty" }, "Aucune observation ici.")));
}

function obsCard(o) {
  const r = o.request;
  const p = r ? one(r.private) : null;
  const canReply = r && r.wants_contact && p && p.contact_value;

  let reply = null;
  if (canReply && o.status !== "transmise") {
    const greeting = p.first_name ? "Bonjour " + p.first_name + "," : "Bonjour,";
    const ta = h("textarea", { id: "reply-" + o.id, maxlength: "4000" });
    ta.value = greeting + "\n\nVous nous avez confié un sujet de prière (référence " + r.code + "). Nous avons prié pour vous, et voici ce qu’un intercesseur a reçu :\n\n" + o.body + "\n\nNous continuons de vous porter dans la prière.\n\nL’équipe Yachad Ezer";
    const copy = h("button", { class: "btn btn-primary btn-sm", type: "button" }, "Copier le message");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(ta.value); toast("Message copié."); }
      catch { ta.select(); toast("Sélectionné : faites Ctrl+C."); }
    });
    const mailHref = () => "mailto:" + encodeURIComponent(p.contact_value) + "?subject=" + encodeURIComponent("Votre demande de prière · Yachad Ezer") + "&body=" + encodeURIComponent(ta.value);
    const mail = p.contact_method === "courriel"
      ? h("a", { class: "btn btn-secondary btn-sm", href: mailHref() }, "Ouvrir dans ma messagerie")
      : null;
    if (mail) ta.addEventListener("input", () => { mail.href = mailHref(); });
    const sent = h("button", { class: "btn btn-secondary btn-sm", type: "button" }, "Marquer comme transmise");
    sent.addEventListener("click", () => act(sb.from("observations").update({ status: "transmise", transmitted_at: new Date().toISOString() }).eq("id", o.id), "Observation marquée comme transmise."));
    reply = h("div", { class: "reply" },
      h("label", { for: "reply-" + o.id }, "Réponse à " + (p.first_name || "la personne") + " · " + p.contact_value),
      h("span", { class: "hint" }, p.contact_method === "telephone" ? "Appelez ou textez ce numéro. Le texte ci-dessous peut vous guider." : "Relisez et ajustez avant d’envoyer. Le nom de l’intercesseur n’apparaît pas."),
      ta,
      h("div", { class: "people" }, copy, mail, sent));
  }

  const read = o.status === "nouvelle" ? h("button", { class: "btn btn-ghost btn-sm", type: "button" }, "Marquer comme lue") : null;
  if (read) read.addEventListener("click", () => act(sb.from("observations").update({ status: "lue" }).eq("id", o.id)));

  return h("article", { class: "item" },
    h("div", { class: "item-head" },
      h("span", { class: "code" }, r ? r.code : "—"),
      h("span", { class: o.status === "nouvelle" ? "pill new" : o.status === "transmise" ? "pill ok" : "pill" },
        o.status === "nouvelle" ? "Nouvelle" : o.status === "transmise" ? "Transmise le " + fmtDate(o.transmitted_at) : "Lue"),
      h("span", { class: "meta" }, "Par " + memberName(o.member_id) + " · " + relDate(o.created_at))),
    h("p", { class: "body" }, o.body),
    r ? h("details", {}, h("summary", { class: "hint", style: "cursor:pointer" }, "Voir la demande"), h("p", { class: "body muted", style: "margin-top:8px" }, r.body)) : null,
    !canReply ? h("p", { class: "hint" }, r && r.wants_contact ? "Contact demandé, mais aucune coordonnée enregistrée." : "Cette personne n’a pas demandé de réponse : l’observation reste interne.") : null,
    reply,
    read ? h("div", { class: "item-foot" }, read) : null);
}

/* ===================== INTERCESSEURS ===================== */
function viewMembers() {
  const openLoad = (id) => state.requests.filter((r) => r.status !== "fermee" && (r.assignments || []).some((a) => a.member_id === id && !a.prayed_at)).length;
  const candidates = state.members.filter((m) => m.role === "candidat");
  const team = state.members.filter((m) => ["intercesseur", "admin"].includes(m.role));

  const candCard = (m) => {
    const yes = h("button", { class: "btn btn-primary btn-sm", type: "button" }, "Accepter");
    yes.addEventListener("click", () => act(sb.from("profiles").update({ role: "intercesseur", active: true, approved_at: new Date().toISOString() }).eq("id", m.id), "Candidature acceptée."));
    const no = h("button", { class: "btn btn-ghost btn-sm", type: "button" }, "Refuser");
    no.addEventListener("click", () => act(sb.from("profiles").update({ role: "refuse", active: false }).eq("id", m.id), "Candidature refusée."));
    return h("article", { class: "item" },
      h("div", { class: "item-head" },
        avatar(m.id, m.display_name, "lg"),
        h("div", { class: "stack", style: "gap:0" }, h("b", {}, m.display_name || "Sans nom"), h("span", { class: "hint" }, m.church || "Église non indiquée")),
        h("span", { class: "meta" }, "Inscrit " + relDate(m.created_at))),
      h("p", { class: "body" }, m.motivation || "Pas de motivation indiquée."),
      h("div", { class: "tags" }, m.engagement_at
        ? h("span", { class: "pill ok" }, "Engagement de confidentialité accepté")
        : h("span", { class: "pill new" }, "Engagement non accepté")),
      h("div", { class: "item-foot" }, yes, no));
  };

  const teamCard = (m) => {
    const isMe = m.id === me.id;
    const toggle = h("button", { class: "btn btn-secondary btn-sm", type: "button" }, m.active ? "Mettre en pause" : "Réactiver");
    toggle.addEventListener("click", () => act(sb.from("profiles").update({ active: !m.active }).eq("id", m.id), m.active ? "Membre mis en pause." : "Membre réactivé."));
    return h("article", { class: "item member" },
      avatar(m.id, m.display_name, "lg"),
      h("div", { class: "info" },
        h("b", {}, (m.display_name || "Sans nom") + (isMe ? " (vous)" : "")),
        h("span", {}, (m.role === "admin" ? "Administrateur" : "Intercesseur") + " · " + openLoad(m.id) + " à prier")),
      h("span", { class: m.active ? "pill ok" : "pill" }, m.active ? "Actif" : "En pause"),
      isMe ? null : toggle);
  };

  return h("div", { class: "stack", style: "gap:24px" },
    pageHead("Intercesseurs", "Acceptez les candidatures et gérez l’équipe."),
    h("h2", { style: "font-size:1.4rem" }, "Candidatures"),
    candidates.length ? h("div", { class: "list" }, candidates.map(candCard)) : h("p", { class: "empty" }, "Aucune candidature en attente."),
    h("h2", { style: "font-size:1.4rem" }, "Équipe"),
    h("div", { class: "grid-2" }, team.map(teamCard)));
}

/* ===================== RÉGLAGES ===================== */
function viewSettings() {
  const s = state.settings || { auto_assign: true, per_request: 2 };
  const auto = h("input", { type: "checkbox", id: "set-auto", checked: s.auto_assign });
  const per = h("input", { type: "number", id: "set-per", min: "1", max: "10", value: String(s.per_request) });
  const save = h("button", { class: "btn btn-primary", type: "button" }, "Enregistrer");
  save.addEventListener("click", () => {
    const n = Math.min(10, Math.max(1, parseInt(per.value, 10) || 2));
    act(sb.from("app_settings").update({ auto_assign: auto.checked, per_request: n }).eq("id", 1), "Réglages enregistrés.");
  });
  return h("div", { class: "stack", style: "gap:24px" },
    pageHead("Réglages", "Comment les demandes sont réparties entre les intercesseurs."),
    h("div", { class: "form-card stack", style: "max-width:560px;gap:20px" },
      h("p", { class: "muted" }, "Chaque nouvelle demande est confiée aux intercesseurs actifs qui ont le moins de demandes à prier en ce moment. En cas d’égalité, le choix se fait au hasard. Vous pouvez toujours ajouter ou retirer un intercesseur à la main."),
      h("label", { class: "check" }, auto, h("span", {}, h("b", {}, "Répartir automatiquement"), h("br"), h("span", { class: "hint" }, "Dès qu’une demande arrive. Sinon, utilisez le bouton « Répartir » dans Demandes."))),
      h("div", { class: "field" }, h("label", { for: "set-per" }, "Nombre d’intercesseurs par demande"), per),
      save));
}
</script>
</body>
</html>
